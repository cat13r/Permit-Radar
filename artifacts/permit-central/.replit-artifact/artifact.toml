kind = "web"
previewPath = "/"
title = "permitnative"
description = "A mobile-friendly permit lead service for Chicago contractors, with new building permits matched by trade and ZIP code, daily email digests, and a $99 monthly subscription."
version = "1.0.0"
id = "artifacts/permit-central"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24764

[services.development]
run = "pnpm --filter @workspace/permit-central run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/permit-central", "run", "build" ]
serve = "static"
publicDir = "artifacts/permit-central/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24764"
BASE_PATH = "/"
